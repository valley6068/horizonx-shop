[package]
name = "horizonshop_rs"
version = "2.1.0"
edition = "2024"
publish = false
description = "A DonutSMP-style shop for HorizonX in Rust, remade after Genius Shop (MIT): shop files, buy and sell menus, sell-all chest, /worth, prices that move with trades and with the market."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
horizon-bukkit = { path = "../../hx/sdk/horizon-bukkit" }
horizon-kit = { path = "../../hx/horizonsx/plugins/horizon-kit" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
# Only for the test that feeds our item text through the game's own SNBT reader.
horizon-world = { path = "../../hx/horizonsx/crates/horizon-world" }

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
codegen-units = 4

[workspace]
